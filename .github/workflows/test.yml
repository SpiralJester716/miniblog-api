name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: miniblog
          POSTGRES_PASSWORD: miniblog
          POSTGRES_DB: miniblog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U miniblog -d miniblog_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://miniblog:miniblog@localhost:5432/miniblog_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
